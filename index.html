<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wander — web performance demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: #f7f5f1;
    color: #1a1815;
    font-family: Georgia, "Times New Roman", Times, serif;
    line-height: 1.6;
  }
  main { width: 100%; max-width: 34rem; }
  .kicker {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #8c857c;
    margin: 0 0 0.75rem;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 2.9rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 0.9rem;
  }
  .blurb { color: #55504a; margin: 0 0 2.25rem; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid #ded8cf; }
  li { border-bottom: 1px solid #ded8cf; }
  a.row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 1.15rem 0.25rem;
    text-decoration: none;
    color: inherit;
  }
  a.row:hover { background: #f0ece5; }
  .label { font-size: 1.35rem; }
  .note {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8c857c;
  }
  li.pending { opacity: 0.55; }
  li.pending .row { pointer-events: none; }
  footer {
    margin-top: 2.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #8c857c;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <p class="kicker">Web performance demo</p>
  <h1>Wander</h1>
  <p class="blurb">
    The same editorial travel page, served two ways. Load each one with the network panel
    open and compare the image payload.
  </p>

  <ul>
    <li>
      <a class="row" href="before/index.html">
        <span class="label">Before</span>
        <span class="note">7 original JPEGs &middot; ~31 MB</span>
      </a>
    </li>
    <li class="pending">
      <a class="row" href="after/index.html">
        <span class="label">After</span>
        <span class="note">Not built yet</span>
      </a>
    </li>
  </ul>

  <footer>
    <a href="CREDITS.md">Photo credits</a>
  </footer>
</main>
</body>
</html>
